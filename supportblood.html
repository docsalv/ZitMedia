
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Someone in Need | 3AM Foundation</title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #222;
            line-height: 1.6;
        }


        /* =====================================================
           MAIN SECTION
        ====================================================== */

        .support-section {

            min-height: 100vh;

            padding: 60px 20px;

            display: flex;

            justify-content: center;

            align-items: flex-start;
        }


        /* =====================================================
           FORM CONTAINER
        ====================================================== */

        .form-container {

            width: 100%;

            max-width: 650px;

            background: #ffffff;

            padding: 45px;

            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .form-header {

            text-align: center;

            margin-bottom: 35px;
        }


        .small-title {

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 2px;

            color: #b30000;

            margin-bottom: 10px;
        }


        .form-header h1 {

            font-size: 36px;

            line-height: 1.2;

            margin-bottom: 15px;
        }


        .form-header p {

            color: #666;

            font-size: 15px;

            max-width: 520px;

            margin: auto;
        }


        /* =====================================================
           INFORMATION BOX
        ====================================================== */

        .info-box {

            background: #fff5f5;

            border-left: 4px solid #b30000;

            padding: 15px;

            margin-bottom: 30px;

            border-radius: 6px;

            font-size: 14px;

            color: #555;
        }


        /* =====================================================
           FORM SECTION
        ====================================================== */

        .form-section {

            margin-bottom: 30px;
        }


        .form-section h2 {

            font-size: 20px;

            margin-bottom: 20px;

            padding-bottom: 10px;

            border-bottom: 1px solid #eeeeee;
        }


        /* =====================================================
           INPUT GROUP
        ====================================================== */

        .input-group {

            margin-bottom: 20px;
        }


        .input-group label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        /* =====================================================
           INPUTS
        ====================================================== */

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="number"] {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid #dddddd;

            border-radius: 8px;

            font-size: 15px;

            font-family: inherit;

            outline: none;

            background: #ffffff;

            transition: border 0.2s ease;
        }


        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus {

            border-color: #b30000;
        }


        /* =====================================================
           AMOUNT FIELD
        ====================================================== */

        .amount-wrapper {

            position: relative;
        }


        .currency {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-weight: 700;

            color: #555;

            pointer-events: none;
        }


        .amount-wrapper input {

            padding-left: 35px;
        }


        /* =====================================================
           CONSENT
        ====================================================== */

        .consent {

            margin-bottom: 25px;

            padding: 15px;

            background: #f9f9f9;

            border-radius: 8px;

            font-size: 13px;

            color: #555;
        }


        .consent label {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            cursor: pointer;
        }


        .consent input {

            margin-top: 4px;
        }


        /* =====================================================
           BUTTON
        ====================================================== */

        button {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 8px;

            background: #b30000;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        button:hover {

            background: #8f0000;

            transform: translateY(-1px);
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           FORM MESSAGE
        ====================================================== */

        #formMessage {

            text-align: center;

            margin-top: 18px;

            font-size: 14px;

            font-weight: 600;

            min-height: 20px;
        }


        .success {

            color: #188038;
        }


        .error {

            color: #b30000;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            .support-section {

                padding: 30px 15px;
            }


            .form-container {

                padding: 30px 20px;

                border-radius: 12px;
            }


            .form-header h1 {

                font-size: 29px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         SUPPORT BLOOD SECTION
    ====================================================== -->

    <section class="support-section">


        <div class="form-container">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <div class="form-header">

                <p class="small-title">
                    3AM FOUNDATION
                </p>


                <h1>
                    Support Someone in Need
                </h1>


                <p>
                    Your support can help provide critical
                    assistance to someone in need of blood.
                </p>

            </div>



            <!-- =================================================
                 INFORMATION BOX
            ================================================== -->

            <div class="info-box">

                Thank you for choosing to support someone
                in need. Fill in your details below and
                our team will reach out to you.

            </div>



            <!-- =================================================
                 FORM
            ================================================== -->

            <form id="supportBloodForm">


                <!-- =================================================
                     YOUR INFORMATION
                ================================================== -->

                <div class="form-section">

                    <h2>
                        Your Information
                    </h2>


                    <!-- FULL NAME -->

                    <div class="input-group">

                        <label for="fullName">
                            Full Name
                        </label>


                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>



                    <!-- PHONE -->

                    <div class="input-group">

                        <label for="phone">
                            Phone Number
                        </label>


                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>

                </div>



               <!-- =================================================
     SUPPORT INFORMATION
================================================== -->

<div class="form-section">

    <h2>
        Your Support
    </h2>


    <div class="input-group">

        <label for="currency">
            Currency
        </label>

        <select
            id="currency"
            name="currency"
            required
        >

            <option value="">
                Select currency
            </option>

            <option value="NGN - Nigerian Naira">
                ₦ Nigerian Naira (NGN)
            </option>

            <option value="USD - US Dollar">
                $ US Dollar (USD)
            </option>

            <option value="GBP - British Pound">
                £ British Pound (GBP)
            </option>

            <option value="EUR - Euro">
                € Euro (EUR)
            </option>

            <option value="CAD - Canadian Dollar">
                $ Canadian Dollar (CAD)
            </option>

            <option value="AUD - Australian Dollar">
                $ Australian Dollar (AUD)
            </option>

            <option value="GHS - Ghanaian Cedi">
                ₵ Ghanaian Cedi (GHS)
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>


    <div class="input-group">

        <label for="supportAmount">
            How much would you like to support?
        </label>

        <div class="amount-wrapper">

            <input
                type="number"
                id="supportAmount"
                name="supportAmount"
                placeholder="Enter amount"
                min="1"
                step="0.01"
                required
            >

        </div>

    </div>

</div>


                <!-- =================================================
                     CONSENT
                ================================================== -->

                <div class="consent">

                    <label>

                        <input
                            type="checkbox"
                            id="consent"
                            required
                        >


                        <span>

                            I agree to be contacted by
                            3AM Foundation regarding my
                            support.

                        </span>

                    </label>

                </div>



                <!-- =================================================
                     SUBMIT BUTTON
                ================================================== -->

                <button
                    type="submit"
                    id="submitButton"
                >

                    Submit Support Request

                </button>


                <!-- STATUS MESSAGE -->

                <p id="formMessage"></p>


            </form>

        </div>

    </section>



    <!-- =====================================================
         EMAILJS LIBRARY
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        // =====================================================
        // INITIALIZE EMAILJS
        // =====================================================

        emailjs.init({

            publicKey: "puKTRgVmJv458Fs08"

        });



        // =====================================================
        // GET FORM ELEMENTS
        // =====================================================

        const form =
            document.getElementById("supportBloodForm");


        const submitButton =
            document.getElementById("submitButton");


        const formMessage =
            document.getElementById("formMessage");



        // =====================================================
        // FORM SUBMISSION
        // =====================================================

        form.addEventListener(

            "submit",

            function(event) {


                // Prevent page refresh

                event.preventDefault();



                // Change button

                submitButton.disabled = true;

                submitButton.textContent =
                    "Submitting...";



                // =================================================
                // GET FORM DATA
                // =================================================

                const formData =
                    new FormData(form);



                // =================================================
                // PREPARE EMAIL DATA
                // =================================================

               const templateParams = {

    fullName:
        formData.get("fullName"),

    phone:
        formData.get("phone"),

    email:
        formData.get("email"),

    currency:
        formData.get("currency"),

    supportAmount:
        formData.get("supportAmount")

};


                // =================================================
                // SEND EMAIL THROUGH EMAILJS
                // =================================================

                emailjs.send(

                    "service_igm57xj",

                    "template_hycmx29",

                    templateParams

                )



                // =================================================
                // SUCCESS
                // =================================================

                .then(function(response) {


                    console.log(

                        "SUCCESS!",

                        response.status,

                        response.text

                    );


                    formMessage.textContent =
                        "Thank you for your support. Our team will contact you shortly.";


                    formMessage.className =
                        "success";


                    // Clear the form

                    form.reset();


                    // Restore button

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Submit Support Request";

                })



                // =================================================
                // ERROR
                // =================================================

                .catch(function(error) {


                    console.error(

                        "EmailJS Error:",

                        error

                    );


                    formMessage.textContent =
                        "Something went wrong. Please try again.";

                    formMessage.className =
                        "error";


                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Submit Support Request";

                });

            }

        );

    </script>


</body>

</html>
